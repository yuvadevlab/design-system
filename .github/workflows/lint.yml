name: "🎨 Lint"

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Runs ESLint checks across the workspace"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env

      - name: Run Lint
        run: pnpm run lint

name: "✨ Format"

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: "Verifies Prettier formatting across all files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env

      - name: Check Format
        run: pnpm run format:check
